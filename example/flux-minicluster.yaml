apiVersion: flux-framework.org/v1alpha2
kind: MiniCluster
metadata:
  name: lmp
spec:
  # Update the nodes (size) and MPI workers (tasks) for your setup
  size: 2
  tasks: 128
  # Uncoment this to shell inside:
  # interactive: true
  # Then do: 
  #   flux proxy local:///mnt/flux/view/run/flux/local bash
  #   flux resource list
  #   unset LD_LIBRARY_PATH
  logging:
    quiet: false

  pod:
    nodeSelector:
      cray.nnf.node: "true"
    tolerations:
      - effect: NoSchedule
        key: cray.nnf.node
        operator: Equal
        value: "true"
      
  flux:
    container:
      disable: true

  containers:
    - image: ghcr.io/converged-computing/lammps-reax:ubuntu2404-cxi
      workingDir: /opt/lammps/examples/reaxff/HNS
      commands:
        pre: unset LD_LIBRARY_PATH
      # Update this problem size to one reasonable to run on your resources
      command: lmp -v x 8 -v y 8 -v z 8 -in in.reaxff.hns -nocite
      environment:
        OMPI_MCA_orte_base_help_aggregate: "0"
        OMPI_MCA_btl: "^openib"
      volumes:
        devices:
          hostPath: /sys/devices
          path: /sys/devices
        net:
          hostPath: /sys/class/net
          path: /sys/class/net
      resources:
       limits:
          beta.hpe.com/cxi: 1
       requests: 
          beta.hpe.com/cxi: 1
